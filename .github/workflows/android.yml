name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Build web app and copy into Android
        run: npm run sync

      - name: Write signing key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.p12"

      - name: Build app bundle (.aab) and test APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ env.HAS_KEY == 'true' && format('{0}/upload.p12', runner.temp) || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            { grep -A 14 "What went wrong" "$RUNNER_TEMP/gradle.log"; grep -E "Caused by|e: |error:|build.gradle' line" "$RUNNER_TEMP/gradle.log" | head -15; } | grep -v "^\s*$" | head -45 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: hzuz-tal-bini-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
